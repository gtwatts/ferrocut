[package]
name = "ferrocut-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ferrocut engine: timeline, scheduler, pull-based render graph, FFmpeg I/O, wgpu compositor"
# Lets dependents' build scripts read the FFmpeg rpaths (see build.rs).
links = "ferrocut-engine-ffmpeg"

[[bin]]
name = "ferrocut"
path = "src/main.rs"

[dependencies]
ferrocut-core.workspace = true
ferrocut-audio.workspace = true
ferrocut-colorspace = { path = "../ferrocut-colorspace" }
# SeePlus's H.264/MP4 delivery (runtime-loaded Cisco OpenH264; never vendored).
ferrocut-deliver = { path = "../ferrocut-deliver" }
# SeePlus's perception crate (never depends on the engine): the audio
# mixdown measures loudness with its block-energy chunk records, so the
# render report and `ferrocut-perceive check` share one format and cache.
ferrocut-perceive = { path = "../ferrocut-perceive" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1.8"
bytemuck = { version = "1", features = ["derive"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
rayon = "1.12"
# Explicit-font native typography and native vector coverage (no browser host).
cosmic-text = "0.19"
swash = "0.2.10"
unicode-segmentation = "1.12"
unicode-script = "0.5"
tiny-skia = "0.12"
half = "2.7"
# Expressions (MIT/Apache-2.0): sandboxed, no modules/time/I/O, op limits.
rhai = { version = "1.26", features = ["no_module", "no_time", "no_custom_syntax", "sync"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[build-dependencies]
ferrocut-build = { path = "../ferrocut-build" }

[dev-dependencies]
half = "2.7"
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3"
