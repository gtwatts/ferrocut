[package]
name = "ferrocut-html"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "HTML/CSS/JS layer for Ferrocut: offscreen Chromium (CEF, BSD) in an isolated host process; page clocks follow graph time only"
build = "build.rs"

[dependencies]
ferrocut-colorspace = { path = "../ferrocut-colorspace" }
ferrocut-core = { workspace = true }
ferrocut-ipc = { path = "../ferrocut-ipc" }
half = "2.7"

[build-dependencies]
cmake = "0.1.54"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ferrocut_html_no_host)"] }
