[package]
name = "cutline-engine"
version.workspace = true
edition.workspace = true
description = "Cutline engine: timeline, scheduler, pull-based render graph, FFmpeg I/O, wgpu compositor"

[[bin]]
name = "cutline"
path = "src/main.rs"

[dependencies]
cutline-core.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1.8"
bytemuck = { version = "1", features = ["derive"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[dev-dependencies]
half = "2.7"
tempfile = "3"
