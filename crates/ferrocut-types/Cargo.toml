[package]
name = "ferrocut-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ferrocut's lightweight shared types (no GPU deps): rational time, content hashes, color-space tags, CPU frames, node errors, cancellation"

[dependencies]
blake3 = "1.8"
bytemuck = "1"
half = { version = "2.7", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
