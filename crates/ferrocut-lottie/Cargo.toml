[package]
name = "ferrocut-lottie"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Lottie layer for Ferrocut: ThorVG (MIT) CPU rasterizer behind its C API; frame time comes only from the graph"
build = "build.rs"

[dependencies]
ferrocut-colorspace = { path = "../ferrocut-colorspace" }
ferrocut-core = { workspace = true }
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ferrocut_no_thorvg)"] }
