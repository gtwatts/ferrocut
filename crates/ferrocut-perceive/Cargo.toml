[package]
name = "ferrocut-perceive"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Ferrocut perception report: GPU scopes, contact sheets, shot-boundary checks and EBU R128 loudness for agents to critique their renders"

[[bin]]
name = "ferrocut-perceive"
path = "src/bin/ferrocut-perceive.rs"

[dependencies]
ferrocut-core.workspace = true
anyhow = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
# Same features as ferrocut-engine: no new FFmpeg feature unification.
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[dev-dependencies]
# Dev-only: end-to-end tests render real timelines. perceive itself never
# depends on the engine, so the engine can depend on perceive.
ferrocut-engine = { path = "../ferrocut-engine" }
tempfile = "3"
