[package]
name = "cutline-core"
version.workspace = true
edition.workspace = true
description = "Shared types for Cutline: rational time, frames, render node trait (PROVISIONAL)"

[dependencies]
blake3 = "1.8"
bytemuck = "1"
half = { version = "2.7", features = ["bytemuck"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
wgpu = "30"

[dev-dependencies]
serde_json = "1"
