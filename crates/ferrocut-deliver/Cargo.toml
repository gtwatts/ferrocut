[package]
name = "ferrocut-deliver"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Ferrocut H.264/MP4 delivery encoder: Cisco's runtime-downloaded OpenH264, chunk-parallel deterministic encode, BT.709 limited range, AAC, faststart MP4"

[[bin]]
name = "ferrocut-deliver"
path = "src/bin/ferrocut-deliver.rs"

[dependencies]
ferrocut-colorspace = { path = "../ferrocut-colorspace" }
ferrocut-types.workspace = true
anyhow = "1"
# Pure-Rust libbz2 backend (libbz2-rs-sys, bzip2-1.0.6 license): no C bzip2.
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
# Same features as ferrocut-engine: no new FFmpeg feature unification.
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
libloading = "0.8"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
