[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gtwatts/ferrocut"

[workspace.dependencies]
ferrocut-core = { path = "crates/ferrocut-core" }
ferrocut-types = { path = "crates/ferrocut-types" }
# TEMP alias until SeePlus renames: cutline-color, cutline-ofx and cutline-lottie
# depend on `cutline-core = { workspace = true }` and use `cutline_core::...`.
cutline-core = { path = "crates/ferrocut-core", package = "ferrocut-core" }
