[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/storytold/filmcraft", "vendor/storytold/effectcraft"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gtwatts/ferrocut"

[workspace.dependencies]
ferrocut-audio = { path = "crates/ferrocut-audio" }
ferrocut-core = { path = "crates/ferrocut-core" }
ferrocut-types = { path = "crates/ferrocut-types" }
